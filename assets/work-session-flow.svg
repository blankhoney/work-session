<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 960" role="img" aria-labelledby="title desc">
  <title id="title">Work Session four-step workflow</title>
  <desc id="desc">A language-neutral cartoon flow from planning, through parallel construction and independent review, to final verification.</desc>
  <defs>
    <style>
      .ink { stroke: #0b0b0b; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #0b0b0b; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .hair { stroke: #52514e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .blue { fill: #cde2fb; }
      .blue-strong { fill: #2a78d6; }
      .orange { fill: #f9d2c2; }
      .orange-strong { fill: #eb6834; }
      .aqua { fill: #ccefe3; }
      .aqua-strong { fill: #1baf7a; }
      .yellow { fill: #fbe9b3; }
      .violet { fill: #ddd8f5; }
      .violet-strong { fill: #4a3aa7; }
      .skin { fill: #f3c7a7; }
      .white { fill: #fff; }
      .none { fill: none; }
      .step { font: 800 38px/1 system-ui, sans-serif; fill: #0b0b0b; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arrowhead" markerWidth="18" markerHeight="18" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2a78d6"/>
    </marker>
  </defs>

  <rect width="1536" height="960" rx="48" fill="#f6f8fb"/>

  <g class="ink">
    <rect x="42" y="92" width="330" height="776" rx="46" class="blue"/>
    <rect x="416" y="92" width="330" height="776" rx="46" class="yellow"/>
    <rect x="790" y="92" width="330" height="776" rx="46" class="aqua"/>
    <rect x="1164" y="92" width="330" height="776" rx="46" class="violet"/>
  </g>

  <g fill="none" stroke="#2a78d6" stroke-width="14" stroke-linecap="round" marker-end="url(#arrowhead)">
    <path d="M380 480 H399"/>
    <path d="M754 480 H773"/>
    <path d="M1128 480 H1147"/>
  </g>

  <g>
    <circle cx="94" cy="142" r="35" class="white ink"/><text x="94" y="142" class="step">1</text>
    <circle cx="468" cy="142" r="35" class="white ink"/><text x="468" y="142" class="step">2</text>
    <circle cx="842" cy="142" r="35" class="white ink"/><text x="842" y="142" class="step">3</text>
    <circle cx="1216" cy="142" r="35" class="white ink"/><text x="1216" y="142" class="step">4</text>
  </g>

  <!-- 1: understand and split -->
  <g>
    <rect x="82" y="210" width="112" height="96" rx="18" class="white thin" transform="rotate(-5 138 258)"/>
    <path d="M106 243 h62 M106 265 h44" class="hair none" transform="rotate(-5 138 258)"/>
    <circle cx="286" cy="248" r="48" class="white thin"/>
    <path d="M269 246 l13 13 25-30" class="none thin"/>

    <circle cx="226" cy="394" r="51" class="skin ink"/>
    <path d="M180 389 q18-72 76-38 q25 14 21 50 q-13-22-34-31 q-29 19-63 19" fill="#342a28" class="ink"/>
    <circle cx="209" cy="400" r="4" fill="#0b0b0b"/>
    <circle cx="242" cy="400" r="4" fill="#0b0b0b"/>
    <path d="M213 422 q13 10 27 0" class="none hair"/>
    <path d="M162 571 q7-119 64-119 q58 0 66 119" class="blue-strong ink"/>
    <path d="M191 467 l35 36 35-36" class="white thin"/>

    <path d="M73 666 H340" class="none ink"/>
    <path d="M100 666 v128 M313 666 v128" class="none thin"/>
    <rect x="206" y="548" width="120" height="91" rx="12" class="white ink"/>
    <path d="M220 641 h120" class="none ink"/>
    <circle cx="266" cy="594" r="10" class="blue-strong"/>

    <path d="M82 522 q0-21 21-21 h83 v127 h-83 q-21 0-21-21 z" class="white ink"/>
    <path d="M103 501 q-22 0-22 21 q0 20 22 20 M103 587 h61 M103 607 h44" class="none hair"/>

    <path d="M226 690 v35 M226 725 h-74 M226 725 h74" class="none thin"/>
    <rect x="116" y="744" width="72" height="54" rx="12" class="orange thin"/>
    <rect x="190" y="744" width="72" height="54" rx="12" class="aqua thin"/>
    <rect x="264" y="744" width="72" height="54" rx="12" class="violet thin"/>
  </g>

  <!-- 2: bounded parallel construction -->
  <g>
    <path d="M526 222 v540 M637 222 v540" stroke="#0b0b0b" stroke-width="5" stroke-dasharray="14 16" opacity=".22"/>

    <circle cx="474" cy="333" r="34" class="skin thin"/>
    <path d="M442 329 q14-49 55-19 q10 8 10 28 q-20-14-35-18 q-12 12-30 9" fill="#342a28" class="thin"/>
    <path d="M430 461 q4-85 44-85 q42 0 46 85" class="orange-strong thin"/>
    <rect x="435" y="445" width="82" height="61" rx="8" class="white thin"/>
    <path d="M450 475 l10-10 M450 475 l10 10 M500 465 l-10 10 M500 485 l-10-10" class="none hair"/>
    <rect x="439" y="542" width="74" height="58" rx="11" class="white thin"/>
    <path d="M455 562 h42 M455 579 h29" class="hair none"/>

    <circle cx="581" cy="333" r="34" class="skin thin"/>
    <path d="M550 331 q7-48 42-34 q24 7 25 37 q-29-17-67-3" fill="#5c3f31" class="thin"/>
    <path d="M537 461 q4-85 44-85 q42 0 46 85" class="aqua-strong thin"/>
    <path d="M555 454 h52" class="none thin"/>
    <g transform="translate(542 500)">
      <path d="M0 0 h41 q-4 19 13 19 q17 0 13-19 h40 v40 q-19-4-19 13 q0 17 19 13 v40 h-40 q4-19-13-19 q-17 0-13 19 h-41 v-40 q19 4 19-13 q0-17-19-13 z" class="violet thin"/>
    </g>

    <circle cx="690" cy="333" r="34" class="skin thin"/>
    <path d="M659 331 q11-45 50-24 q15 10 14 32 q-23-19-64-8" fill="#261f1e" class="thin"/>
    <path d="M646 461 q4-85 44-85 q42 0 46 85" class="violet-strong thin"/>
    <rect x="648" y="487" width="86" height="132" rx="12" class="white thin"/>
    <path d="M669 523 l10 10 18-22 M669 558 l10 10 18-22 M669 593 l10 10 18-22" class="none hair"/>

    <circle cx="474" cy="702" r="29" class="orange thin"/><path d="M463 702 l8 8 16-19" class="none hair"/>
    <circle cx="581" cy="702" r="29" class="aqua thin"/><path d="M570 702 l8 8 16-19" class="none hair"/>
    <circle cx="690" cy="702" r="29" class="violet thin"/><path d="M679 702 l8 8 16-19" class="none hair"/>
  </g>

  <!-- 3: simplify and independent review -->
  <g>
    <rect x="893" y="362" width="126" height="144" rx="20" class="white ink"/>
    <path d="M915 409 l18-18 M915 409 l18 18 M997 391 l-18 18 M997 427 l-18-18 M948 388 l-9 42" class="none thin"/>
    <path d="M919 466 h74" class="hair none"/>

    <path d="M955 282 v42 M934 303 h42 M1013 260 v26 M1000 273 h26" stroke="#eda100" stroke-width="6" stroke-linecap="round"/>
    <path d="M862 314 l61 61" class="none ink"/>
    <path d="M845 297 l24-24 l71 71 l-24 24 z" class="yellow thin"/>
    <path d="M838 289 l-14-22 M854 278 l-3-26 M866 294 l22-14" class="none hair"/>

    <circle cx="861" cy="580" r="39" class="skin thin"/>
    <path d="M826 577 q10-55 49-36 q20 8 24 37 q-30-20-73-1" fill="#342a28" class="thin"/>
    <path d="M810 731 q4-108 52-108 q48 0 53 108" class="blue-strong thin"/>
    <circle cx="944" cy="618" r="49" class="white ink"/>
    <path d="M980 655 l44 44" class="none ink"/>
    <path d="M927 618 h34 M944 601 v34" class="hair none"/>
    <path d="M906 675 l37-22" class="none thin"/>

    <circle cx="1055" cy="580" r="39" class="skin thin"/>
    <path d="M1021 576 q8-52 47-38 q20 7 24 40 q-24-19-71-2" fill="#5c3f31" class="thin"/>
    <path d="M1006 731 q4-108 49-108 q48 0 52 108" class="violet-strong thin"/>
    <path d="M1048 671 q43-11 81 0 v70 q-9 49-41 70 q-31-21-40-70 z" class="white ink"/>
    <path d="M1069 733 l15 15 28-36" class="none thin"/>

    <path d="M958 553 v262" stroke="#0b0b0b" stroke-width="5" stroke-dasharray="14 16" opacity=".22"/>
  </g>

  <!-- 4: original QA and delivery -->
  <g>
    <rect x="1206" y="216" width="169" height="123" rx="18" class="white ink"/>
    <path d="M1270 339 v35 M1237 374 h100" class="none thin"/>
    <circle cx="1290" cy="278" r="36" class="aqua thin"/>
    <path d="M1273 278 l12 13 24-29" class="none ink"/>

    <path d="M1431 210 v213" class="none ink"/>
    <path d="M1431 218 h-86 v86 h86" class="white ink"/>
    <path d="M1345 218 h43 v43 h-43 M1388 261 h43 v43 h-43" fill="#0b0b0b"/>

    <circle cx="1248" cy="500" r="42" class="skin thin"/>
    <path d="M1212 496 q10-60 52-39 q20 9 24 40 q-30-21-76-1" fill="#261f1e" class="thin"/>
    <path d="M1191 694 q6-145 58-145 q53 0 59 145" class="violet-strong ink"/>
    <rect x="1284" y="530" width="128" height="184" rx="17" class="white ink" transform="rotate(4 1348 622)"/>
    <path d="M1311 568 l11 11 20-25 M1311 611 l11 11 20-25 M1311 654 l11 11 20-25" class="none thin" transform="rotate(4 1348 622)"/>
    <path d="M1350 567 h36 M1350 610 h36 M1350 653 h36" class="hair none" transform="rotate(4 1348 622)"/>
    <path d="M1277 593 l42 19" class="none thin"/>

    <circle cx="1432" cy="537" r="37" class="skin thin"/>
    <path d="M1398 533 q10-54 50-35 q17 9 20 37 q-27-18-70-2" fill="#342a28" class="thin"/>
    <path d="M1390 694 q6-112 43-112 q42 0 48 112" class="blue-strong thin"/>
    <path d="M1408 617 l-64 54" class="none thin"/>
    <rect x="1361" y="691" width="105" height="74" rx="14" class="aqua ink"/>
    <path d="M1382 728 l15 15 33-39" class="none ink"/>

    <path d="M1204 805 h248" class="none ink"/>
    <path d="M1228 805 v-32 M1428 805 v-32" class="none thin"/>
  </g>
</svg>
